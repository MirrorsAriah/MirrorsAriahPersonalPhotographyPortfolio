backend:
  name: git-gateway
  branch: main

media_folder: 'public/images/uploads' # 上传的图片存储位置
public_folder: '/images/uploads' # 生成的图片访问路径

locale: 'zh_CN'

collections:
  - name: 'blog'
    label: '博客文章'
    folder: 'src/content/blog' # 请确保与实际模板的博客目录一致
    create: true
    slug: '{{slug}}'
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '发布日期', name: 'publishDate', widget: 'datetime' }
      - label: '标签'
        name: 'tags'
        widget: 'list'
        default: []
        field: { label: '标签项', name: 'tag', widget: 'string' }
      - { label: '描述', name: 'description', widget: 'text', required: false }
      - { label: '草稿', name: 'draft', widget: 'boolean', default: false, required: false }
      - { label: '正文', name: 'body', widget: 'markdown' }

  - name: 'works'
    label: '项目作品'
    folder: 'src/content/works' # 请确保与实际模板的作品目录一致
    create: true
    slug: '{{slug}}'
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '描述', name: 'description', widget: 'text' }
      - { label: '缩略图', name: 'thumbnail', widget: 'image', required: false }
      - label: '技术栈'
        name: 'tech'
        widget: 'list'
        required: false
        field: { label: '技术', name: 'techItem', widget: 'string' }
      - { label: '项目链接', name: 'link', widget: 'string', required: false }
      - { label: '仓库链接', name: 'repo', widget: 'string', required: false }
      - { label: '排序', name: 'order', widget: 'number', required: false, value_type: 'int' }
      - { label: '发布日期', name: 'publishDate', widget: 'datetime' }
